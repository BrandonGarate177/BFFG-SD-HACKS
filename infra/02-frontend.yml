AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static frontend and the PMTiles archive. Two buckets behind one CloudFront
  distribution: the app at /, the 73 MB tile archive at /tiles/*.

  The tiles are a separate bucket so a frontend rebuild does not re-upload
  73 MB, and so tile caching can outlive app deploys.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bffg-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bffg-tiles-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          # PMTiles issues cross-origin ranged GETs and reads Content-Range
          # off the response, so both the Range header and the exposed
          # headers below are required.
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [Content-Length, Content-Range, ETag, Accept-Ranges]
            MaxAge: 3000

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub bffg-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
          - Id: tiles
            DomainName: !GetAtt TilesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: /tiles/*
            TargetOriginId: tiles
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # CORS-S3Origin: forwards Origin + the Range header, which is
            # what makes PMTiles work at all.
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            # Already gzip-compressed internally; re-compressing breaks ranges.
            Compress: false
        CustomErrorResponses:
          # BrowserRouter: /parcel/:apn is not an object in S3, so S3 returns
          # 403 (not 404, because ListBucket is denied). Both must serve the
          # app shell or every deep link and refresh breaks in production.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  TilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TilesBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${TilesBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  TilesBucketName:
    Value: !Ref TilesBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  TilesUrl:
    Value: !Sub https://${Distribution.DomainName}/tiles/parcels.pmtiles
