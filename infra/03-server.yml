AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FastAPI server on ECS Fargate behind an ALB. Uses the account's default VPC
  to avoid standing up networking for a demo — pass its id and two public
  subnets as parameters.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets in different AZs.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Stored in Secrets Manager, injected into the task at runtime.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: bffg-server
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 5",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
            "action":{"type":"expire"}}]}

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: bffg/anthropic-api-key
      SecretString: !Ref AnthropicApiKey

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/bffg-server
      RetentionInDays: 7

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: public ingress to the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB to task only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bffg-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref ApiKeySecret}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bffg-ecs-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]

  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: bffg}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: bffg-server
      Cpu: "512"
      # 2 GB, not 1. Resident memory settles ~554 MB after a few /search
      # calls and pandas spikes above that mid-filter; 1024 leaves no headroom
      # and the task gets OOM-killed rather than throttled.
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: server
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/bffg-server:latest
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          Secrets:
            - {Name: ANTHROPIC_API_KEY, ValueFrom: !Ref ApiKeySecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        # Server pings the websocket every 25s; idle timeout must exceed it
        # or the ALB closes /ws/rag/chat mid-conversation.
        - {Key: idle_timeout.timeout_seconds, Value: "120"}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      # The container spends ~14s loading predictions.parquet before it can
      # answer anything. Defaults would mark it unhealthy and kill it in a
      # loop before it ever finishes booting.
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: bffg-server
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      # Same reason as the health check tuning: give it 2 minutes to boot
      # before health checks are allowed to fail the task.
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: server, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup}

Outputs:
  ApiUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
    Description: Set as VITE_API_BASE when building the frontend.
  RepositoryUri:
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/bffg-server
