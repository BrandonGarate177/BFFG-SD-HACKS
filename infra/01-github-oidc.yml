AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC trust. Lets workflows in this repo assume a deploy role
  using a short-lived token, so no AWS access keys exist in GitHub secrets, on
  a laptop, or in a chat transcript.

Parameters:
  GitHubOrg:
    Type: String
    Default: BrandonGarate177
  GitHubRepo:
    Type: String
    Default: BFFG-SD-HACKS

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS now validates GitHub's cert chain against its own trust store, but
      # the thumbprint field is still required by the API.
      ThumbprintList: ["6938fd4d98bab03faadb97b34396831e3780aea1"]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bffg-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to this repo. Without this condition ANY GitHub repo
              # on the internet could assume the role.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:PutObjectAcl
                Resource:
                  - !Sub arn:aws:s3:::bffg-site-${AWS::AccountId}
                  - !Sub arn:aws:s3:::bffg-site-${AWS::AccountId}/*
                  - !Sub arn:aws:s3:::bffg-tiles-${AWS::AccountId}
                  - !Sub arn:aws:s3:::bffg-tiles-${AWS::AccountId}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/bffg-ecs-execution
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/bffg-ecs-task

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Set as the AWS_DEPLOY_ROLE variable in GitHub repo settings.
