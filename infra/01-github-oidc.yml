AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC trust. Lets workflows in this repo assume a deploy role
  using a short-lived token, so no AWS access keys exist in GitHub secrets, on
  a laptop, or in a chat transcript.

Parameters:
  GitHubOrg:
    Type: String
    Default: BrandonGarate177
  GitHubRepo:
    Type: String
    Default: BFFG-SD-HACKS
  GitHubOwnerId:
    Type: String
    Default: "166776131"
    Description: >
      Numeric owner id. GitHub now issues the sub claim in an immutable form
      that embeds numeric ids — repo:OWNER@<ownerId>/REPO@<repoId>:ref:... —
      so a pattern written against names alone never matches and every job
      fails with "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      Nothing in the workflow logs names the claim; only CloudTrail does.
      Find yours with: gh api repos/OWNER/REPO --jq '.owner.id, .id'
  GitHubRepoId:
    Type: String
    Default: "1341224109"
    Description: Numeric repository id. See GitHubOwnerId.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS now validates GitHub's cert chain against its own trust store, but
      # the thumbprint field is still required by the API.
      # Both of GitHub's published thumbprints. AWS validates the cert chain
      # itself for well-known providers, but the field is still required.
      ThumbprintList:
        - "6938fd4d98bab03faadb97b34396831e3780aea1"
        - "1c58a3a8518e8759bf075b76b750d4f2df264fcd"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bffg-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to this repo. Without this condition ANY GitHub repo
              # on the internet could assume the role.
              #
              # Both forms are listed: the id-bearing one is what GitHub
              # actually sends today, and the name-only one is kept for
              # older/other token formats. Matching on ids is also stricter —
              # renaming or transferring the repo cannot hand someone else
              # this role.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:*
                  - !Sub repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:*
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:PutObjectAcl
                Resource:
                  - !Sub arn:aws:s3:::bffg-site-${AWS::AccountId}
                  - !Sub arn:aws:s3:::bffg-site-${AWS::AccountId}/*
                  - !Sub arn:aws:s3:::bffg-tiles-${AWS::AccountId}
                  - !Sub arn:aws:s3:::bffg-tiles-${AWS::AccountId}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/bffg-ecs-execution
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/bffg-ecs-task

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Set as the AWS_DEPLOY_ROLE variable in GitHub repo settings.
