<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="By-Right">
  <!-- Faceted crest sigil. Palette locked to src/index.css @theme tokens:
       ink #001a4a / deep #00296b / panel #003f88 / edge #00509d / accent #fdc500 / accent-hi #ffd500. -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="30%" r="78%">
      <stop offset="0" stop-color="#00296b"/>
      <stop offset="1" stop-color="#001a4a"/>
    </radialGradient>
    <linearGradient id="faceL" x1="0.9" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#003f88"/>
      <stop offset="1" stop-color="#00296b"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#00509d"/>
      <stop offset="1" stop-color="#003f88"/>
    </linearGradient>
    <linearGradient id="core" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffd500"/>
      <stop offset="0.55" stop-color="#fdc500"/>
      <stop offset="1" stop-color="#fdc500" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#eaf0fa" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#9db6d8" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#9db6d8" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-40%" width="340%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)"/>

  <!-- Crest: swept prongs, chamfer step, long blade taper. -->
  <g>
    <path d="M32 5 54 15 45 23.5 44 34 32 59 20 34 19 23.5 10 15Z" fill="url(#faceL)"/>
    <path d="M32 5 54 15 45 23.5 44 34 32 59Z" fill="url(#faceR)"/>
    <!-- Chamfer bands: key light upper-right, shade upper-left. -->
    <path d="M32 5 54 15 51.6 17.2 32 8.6Z" fill="#eaf0fa" fill-opacity="0.38"/>
    <path d="M32 5 10 15 12.4 17.2 32 8.6Z" fill="#001a4a" fill-opacity="0.4"/>
    <path d="M44 34 32 59 32 53 43.6 29.5Z" fill="#00509d" fill-opacity="0.5"/>
    <!-- Metal rim keeps the silhouette legible at 16px. -->
    <path d="M32 5 54 15 45 23.5 44 34 32 59 20 34 19 23.5 10 15Z" fill="none"
          stroke="url(#rim)" stroke-width="1.1" stroke-linejoin="miter"/>
  </g>

  <!-- Energy core. -->
  <g filter="url(#glow)">
    <path d="M32 9 36.5 27 32 48 27.5 27Z" fill="url(#core)"/>
  </g>
</svg>
